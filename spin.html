<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>12-Month Lucky Draw</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131b2e;
    --panel-2: #0d1322;
    --text: #f8fafc;
    --muted: #94a3b8;
    --line: rgba(148, 163, 184, 0.18);
    --accent: #f59e0b;
    --ok: #10b981;
    --err: #f87171;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0b1020 0%, #111827 55%, #070b14 100%);
    color: var(--text);
    padding: 24px 16px 48px;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-size: 1.65rem;
    font-weight: 800;
  }

  .sub {
    color: var(--muted);
    font-size: 0.9rem;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }

  .box-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }

  .box-head h2 {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .badge {
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.14);
    color: var(--muted);
  }

  .badge.matched {
    background: rgba(16, 185, 129, 0.18);
    color: #6ee7b7;
  }

  .search-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 0.88rem;
    margin-bottom: 10px;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--accent);
  }

  .table-wrap {
    max-height: 250px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel-2);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  th, td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
  }

  th {
    position: sticky;
    top: 0;
    background: #172036;
    color: #cbd5e1;
    font-weight: 600;
    font-size: 0.8rem;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr.ref-row {
    cursor: pointer;
    transition: background 0.12s ease;
  }

  tr.ref-row:hover {
    background: rgba(148, 163, 184, 0.08);
  }

  tr.ref-row.selected-row {
    background: rgba(245, 158, 11, 0.12);
  }

  tr.ref-row.active-match {
    background: rgba(16, 185, 129, 0.16);
  }

  .status-pill {
    font-size: 0.74rem;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }

  .status-ready {
    background: rgba(59, 130, 246, 0.18);
    color: #93c5fd;
  }

  .status-done {
    background: rgba(16, 185, 129, 0.18);
    color: #6ee7b7;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  @media (max-width: 560px) {
    .form-row {
      grid-template-columns: 1fr;
    }
  }

  label {
    display: block;
    font-size: 0.82rem;
    color: #cbd5e1;
    margin-bottom: 5px;
    font-weight: 600;
  }

  input.entry-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.94rem;
    outline: none;
  }

  input.entry-input:focus {
    border-color: var(--accent);
  }

  .msg-ok {
    color: #6ee7b7;
    font-size: 0.85rem;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .msg-err {
    color: var(--err);
    font-size: 0.85rem;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wheel-stage {
    position: relative;
    width: 290px;
    height: 290px;
    margin: 6px 0 16px;
  }

  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 24px solid #ffffff;
    z-index: 4;
  }

  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  .center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 3px solid #ffffff;
    z-index: 3;
  }

  .spin-btn {
    width: 100%;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    font-size: 0.96rem;
    font-weight: 700;
    cursor: pointer;
    background: var(--accent);
    color: #090d16;
  }

  .spin-btn:disabled {
    background: #334155;
    color: #94a3b8;
    cursor: not-allowed;
  }

  .assigned-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .assigned-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.88rem;
  }

  .month-tag {
    background: rgba(16, 185, 129, 0.16);
    color: #6ee7b7;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.8rem;
  }

  .muted-empty {
    color: var(--muted);
    font-size: 0.86rem;
    text-align: center;
    padding: 18px;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }

  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }

  .modal-month {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    margin: 14px 0 18px;
  }

  .small-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #090d16;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>12-Month Lucky Draw</h1>
        <p class="sub">Type your own Name and Phone Number matching your reference entry to unlock the spin.</p>
      </div>
      <span class="badge" id="matchBadge">No Match</span>
    </header>

    <div class="grid">
      <!-- LEFT COLUMN: REFERENCE TABLE & ASSIGNED MONTHS -->
      <div class="stack">
        <div class="box">
          <div class="box-head">
            <h2>Reference Table</h2>
            <span class="badge" id="refCount">0 entries</span>
          </div>
          <input
            type="text"
            class="search-input"
            id="refSearch"
            placeholder="Search reference table by name or first 4 digits..."
            oninput="renderReferenceTable()"
          >
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone (First 4)</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="referenceBody"></tbody>
            </table>
          </div>
        </div>

        <div class="box">
          <div class="box-head">
            <h2>Assigned Months</h2>
            <span class="badge" id="assignedCount">0 / 12</span>
          </div>
          <ul class="assigned-list" id="assignedList"></ul>
        </div>
      </div>

      <!-- RIGHT COLUMN: MATCH CHECK & SPIN WHEEL -->
      <div class="box">
        <div class="box-head">
          <h2>Verify & Spin</h2>
        </div>

        <div class="form-row">
          <div>
            <label for="playerName">Your Name</label>
            <input
              type="text"
              class="entry-input"
              id="playerName"
              placeholder="Type your exact name"
              autocomplete="off"
              oninput="validateCurrentInput()"
            >
          </div>
          <div>
            <label for="playerPhone">Eg. Roshan Ghimire</label>
            <input
              type="tel"
              class="entry-input"
              id="playerPhone"
              placeholder="Eg. 0452024208"
              autocomplete="off"
              oninput="validateCurrentInput()"
            >
          </div>
        </div>

        <div class="msg-ok" id="okMsg"></div>
        <div class="msg-err" id="errMsg"></div>

        <div class="wheel-area">
          <div class="wheel-stage">
            <div class="pointer"></div>
            <canvas id="wheel" width="460" height="460"></canvas>
            <div class="center-cap"></div>
          </div>
          <button class="spin-btn" id="spinBtn" onclick="handleSpin()" disabled>
            MATCH REFERENCE TO SPIN
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="resultModal">
    <div class="modal-box">
      <div id="modalSub" class="sub"></div>
      <div style="margin-top:6px; font-weight:600;">Assigned Month</div>
      <div class="modal-month" id="modalMonth">JANUARY</div>
      <button type="button" class="small-btn" onclick="closeModal()">Done</button>
    </div>
  </div>

<script>
  const SYNC_ENDPOINT = "https://script.google.com/macros/s/AKfycbwX6RzIgNWfaFk4IXmPc1k0PudiSffW8kNCv1oH82gxmm0LANzAcaMpQjpapBTVZEhM/exec";

  const ALL_MONTHS = [
    "January", "February", "March", "April",
    "May", "June", "July", "August",
    "September", "October", "November", "December"
  ];

  const SLICE_COLORS = [
    "#ef4444", "#f97316", "#f59e0b", "#84cc16",
    "#10b981", "#06b6d4", "#3b82f6", "#6366f1",
    "#8b5cf6", "#d946ef", "#ec4899", "#f43f5e"
  ];

  let referenceUsers = [];
  let entriesByPhone = {};
  let selectedRowKey = "";
  let currentRotation = 0;
  let isSpinning = false;
  let pendingSpin = null;

  function normName(v) {
    return String(v || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  function normPhone(v) {
    let s = String(v || "").trim().replace(/[^\d+]/g, "");
    if (s.startsWith("00")) s = "+" + s.slice(2);
    return s;
  }

  function maskPhone(phone) {
    const clean = normPhone(phone);
    if (!clean) return "—";
    return clean.slice(0, 4) + "***";
  }

  function getEntries() {
    return Object.values(entriesByPhone || {});
  }

  function getAvailableMonths() {
    const taken = new Set(getEntries().map(e => String(e.month || "").toLowerCase()));
    return ALL_MONTHS.filter(m => !taken.has(m.toLowerCase()));
  }

  function findMatchedReference(rawName, rawPhone) {
    const nName = normName(rawName);
    const nPhone = normPhone(rawPhone);
    if (!nName || !nPhone) return null;

    return referenceUsers.find(u => {
      const uName = normName(u.name);
      const uPhone = normPhone(u.phoneKey || u.phone);
      return uName === nName && uPhone === nPhone;
    }) || null;
  }

  function findExistingAssignment(matchedUser) {
    const phoneKey = normPhone(matchedUser.phoneKey || matchedUser.phone);
    if (entriesByPhone[phoneKey]) {
      return entriesByPhone[phoneKey];
    }
    const targetName = normName(matchedUser.name);
    return getEntries().find(e => normName(e.name) === targetName) || null;
  }

  function validateCurrentInput() {
    const okEl = document.getElementById("okMsg");
    const errEl = document.getElementById("errMsg");
    const badge = document.getElementById("matchBadge");
    const spinBtn = document.getElementById("spinBtn");

    okEl.textContent = "";
    errEl.textContent = "";

    if (isSpinning) return;

    const rawName = document.getElementById("playerName").value;
    const rawPhone = document.getElementById("playerPhone").value;
    const matched = findMatchedReference(rawName, rawPhone);

    renderReferenceTable(matched);

    if (!matched) {
      badge.textContent = "No Match";
      badge.className = "badge";
      spinBtn.disabled = true;
      spinBtn.textContent = "MATCH REFERENCE TO SPIN";
      if (rawName.trim() && rawPhone.trim()) {
        errEl.textContent = "Name and phone number must match the same reference record.";
      }
      return;
    }

    const existing = findExistingAssignment(matched);
    if (existing) {
      badge.textContent = "Already Assigned";
      badge.className = "badge";
      spinBtn.disabled = true;
      spinBtn.textContent = "ALREADY ASSIGNED";
      errEl.textContent = `You already assigned for ${existing.month}.`;
      return;
    }

    if (getAvailableMonths().length === 0) {
      badge.textContent = "Complete";
      badge.className = "badge";
      spinBtn.disabled = true;
      spinBtn.textContent = "ALL 12 MONTHS TAKEN";
      errEl.textContent = "All 12 months have already been assigned.";
      return;
    }

    badge.textContent = "Matched";
    badge.className = "badge matched";
    okEl.textContent = `Verified: ${matched.name} (${maskPhone(matched.phone)}) is eligible to spin.`;
    spinBtn.disabled = false;
    spinBtn.textContent = "SPIN WHEEL";
  }

  function highlightReferenceRow(rowKey) {
    if (isSpinning) return;
    selectedRowKey = selectedRowKey === rowKey ? "" : rowKey;
    const currentMatch = findMatchedReference(
      document.getElementById("playerName").value,
      document.getElementById("playerPhone").value
    );
    renderReferenceTable(currentMatch);
  }

  function renderReferenceTable(activeMatch = null) {
    const body = document.getElementById("referenceBody");
    const query = normName(document.getElementById("refSearch").value);
    document.getElementById("refCount").textContent = `${referenceUsers.length} entries`;

    const filtered = referenceUsers.filter(u => {
      if (!query) return true;
      const shownPhone = normName(maskPhone(u.phone));
      return normName(u.name).includes(query) || shownPhone.includes(query);
    });

    body.innerHTML = "";
    if (filtered.length === 0) {
      body.innerHTML = `<tr><td colspan="3" class="muted-empty">No matching reference records.</td></tr>`;
      return;
    }

    const activeKey = activeMatch ? normPhone(activeMatch.phoneKey || activeMatch.phone) : "";

    filtered.forEach((u, idx) => {
      const pKey = normPhone(u.phoneKey || u.phone) || `row-${idx}`;
      const done = Boolean(findExistingAssignment(u));
      const isActive = pKey && pKey === activeKey;
      const isSelected = pKey === selectedRowKey;

      const tr = document.createElement("tr");
      tr.className =
        "ref-row" +
        (isActive ? " active-match" : "") +
        (isSelected ? " selected-row" : "");
      tr.onclick = () => highlightReferenceRow(pKey);
      tr.innerHTML = `
        <td>${esc(u.name)}</td>
        <td>${esc(maskPhone(u.phone))}</td>
        <td><span class="status-pill ${done ? "status-done" : "status-ready"}">${done ? "Assigned" : "Eligible"}</span></td>
      `;
      body.appendChild(tr);
    });
  }

  function renderAssigned() {
    const list = document.getElementById("assignedList");
    const items = getEntries();
    document.getElementById("assignedCount").textContent = `${items.length} / 12`;

    list.innerHTML = "";
    if (items.length === 0) {
      list.innerHTML = `<li class="muted-empty">No months assigned yet.</li>`;
      return;
    }

    items.forEach((item, idx) => {
      const li = document.createElement("li");
      li.className = "assigned-item";
      li.innerHTML = `
        <span><strong>${idx + 1}.</strong> ${esc(item.name)} <span class="sub">(${esc(maskPhone(item.phone))})</span></span>
        <span class="month-tag">${esc(item.month)}</span>
      `;
      list.appendChild(li);
    });
  }

  async function initData() {
    referenceUsers = [];
    entriesByPhone = {};

    if (SYNC_ENDPOINT && SYNC_ENDPOINT.startsWith("http")) {
      try {
        const res = await fetch(SYNC_ENDPOINT, { method: "GET" });
        const data = await res.json();
        if (data && data.ok) {
          if (Array.isArray(data.allowedUsers)) {
            referenceUsers = data.allowedUsers;
          }
          if (data.byPhone && typeof data.byPhone === "object") {
            entriesByPhone = data.byPhone;
          }
        }
      } catch {
        document.getElementById("errMsg").textContent = "Could not load data from spreadsheet.";
      }
    }

    renderReferenceTable();
    renderAssigned();
    drawWheel();
    validateCurrentInput();
  }

  async function handleSpin() {
    if (isSpinning) return;

    const rawName = document.getElementById("playerName").value.trim();
    const rawPhone = document.getElementById("playerPhone").value.trim();
    const matched = findMatchedReference(rawName, rawPhone);

    if (!matched) {
      validateCurrentInput();
      return;
    }

    const existing = findExistingAssignment(matched);
    if (existing) {
      validateCurrentInput();
      document.getElementById("errMsg").textContent = `You already assigned for ${existing.month}.`;
      return;
    }

    const available = getAvailableMonths();
    if (available.length === 0) {
      validateCurrentInput();
      return;
    }

    const phoneKey = normPhone(matched.phoneKey || matched.phone);
    const spinBtn = document.getElementById("spinBtn");
    spinBtn.disabled = true;
    spinBtn.textContent = "VERIFYING...";

    let chosenMonth = "";
    let latestByPhone = null;

    if (SYNC_ENDPOINT && SYNC_ENDPOINT.startsWith("http")) {
      try {
        const res = await fetch(SYNC_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: matched.name,
            phone: matched.phone,
            phoneKey
          })
        });
        const data = await res.json();
        if (!data || !data.ok || !data.month) {
          if (data && data.byPhone) {
            entriesByPhone = data.byPhone;
            renderAssigned();
            renderReferenceTable(matched);
          }
          validateCurrentInput();
          document.getElementById("errMsg").textContent = (data && data.error) || "Spin rejected by database.";
          return;
        }
        chosenMonth = data.month;
        latestByPhone = data.byPhone || null;
      } catch {
        document.getElementById("errMsg").textContent = "Network error while recording spin.";
        validateCurrentInput();
        return;
      }
    } else {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      chosenMonth = available[buf[0] % available.length];
    }

    const targetIdx = available.findIndex(m => m.toLowerCase() === String(chosenMonth).toLowerCase());
    pendingSpin = {
      entry: {
        name: matched.name,
        phone: matched.phone,
        phoneKey,
        month: chosenMonth,
        timestamp: new Date().toISOString()
      },
      latestByPhone
    };

    animateWheel(targetIdx >= 0 ? targetIdx : 0, available);
  }

  function animateWheel(targetIdx, months) {
    isSpinning = true;
    const spinBtn = document.getElementById("spinBtn");
    spinBtn.disabled = true;
    spinBtn.textContent = "SPINNING...";

    const count = months.length;
    const sliceAngle = (Math.PI * 2) / count;
    const centerAngle = (targetIdx + 0.5) * sliceAngle;
    const targetNorm = (-Math.PI / 2 - centerAngle) % (Math.PI * 2);
    const currNorm = currentRotation % (Math.PI * 2);

    let delta = targetNorm - currNorm;
    if (delta < 0) delta += Math.PI * 2;

    const totalDelta = delta + Math.PI * 2 * 6;
    const startRot = currentRotation;
    const duration = 3200;
    const startTime = performance.now();

    function step(now) {
      const t = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      currentRotation = startRot + totalDelta * ease;
      drawWheel(months);

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        isSpinning = false;
        if (pendingSpin) {
          if (pendingSpin.latestByPhone) {
            entriesByPhone = pendingSpin.latestByPhone;
          } else {
            entriesByPhone[pendingSpin.entry.phoneKey] = pendingSpin.entry;
          }
          renderAssigned();
          drawWheel();
          validateCurrentInput();
          openResultModal(pendingSpin.entry);
          pendingSpin = null;
        }
      }
    }

    requestAnimationFrame(step);
  }

  function drawWheel(months = getAvailableMonths()) {
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const size = canvas.width;
    const cx = size / 2;
    const cy = size / 2;
    const r = cx - 4;

    ctx.clearRect(0, 0, size, size);

    if (months.length === 0) {
      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("All 12 Months Taken", cx, cy + 6);
      return;
    }

    const slice = (Math.PI * 2) / months.length;
    for (let i = 0; i < months.length; i++) {
      const m = months[i];
      const colorIdx = ALL_MONTHS.indexOf(m);
      const a0 = currentRotation + i * slice;
      const a1 = a0 + slice;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = SLICE_COLORS[colorIdx >= 0 ? colorIdx : i % SLICE_COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "#0b1020";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a0 + slice / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 17px sans-serif";
      ctx.fillText(m, r - 18, 6);
      ctx.restore();
    }
  }

  function openResultModal(entry) {
    document.getElementById("modalSub").textContent = `${entry.name} • ${maskPhone(entry.phone)}`;
    document.getElementById("modalMonth").textContent = String(entry.month).toUpperCase();
    document.getElementById("resultModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("resultModal").style.display = "none";
  }

  function esc(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  initData();
</script>
</body>
</html>
